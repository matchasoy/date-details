<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A Very Important Question</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">A VERY IMPORTANT QUESTION</p>

      <section class="hero" aria-label="Question card">
        <h1 class="title">
          Dear Hayley,
          Will you go on a <span>date</span><br />
          with me?
        </h1>

        <p class="subtitle">
          Take your time. Choose carefully. There is definitely a right answer.
        </p>

        <div class="button-stage" id="button-stage">
          <button id="yes-button" class="answer answer--yes" type="button">
            Yes 💕
          </button>

          <button id="no-button" class="answer answer--no" type="button">
            No 🥺
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
